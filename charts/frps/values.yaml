replicaCount: 1

image:
  repository: fatedier/frps
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

deploymentAnnotations: {}

auth:
  token: ""
  # Use an existing secret instead of creating one
  # The secret must contain a key "auth-token"
  existingSecret: ""

service:
  type: ClusterIP
  port: 8080
  annotations: {}

bind:
  service:
    type: LoadBalancer
    port: 7000
    annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: "*.example.com"
      paths:
        - path: /
          pathType: Prefix
  tls: []
    # - secretName: frps-wildcard-tls
    #   hosts:
    #     - "*.example.com"

networkPolicy:
  enabled: false

# frps configuration in TOML format
# see https://github.com/fatedier/frp/blob/dev/conf/frps_full_example.toml
# IMPORTANT: bindPort must match bind.service.port, vhostHTTPPort must match service.port
config: |
  bindPort = 7000
  vhostHTTPPort = 8080
  subDomainHost = "example.com"

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

livenessProbe:
  tcpSocket:
    port: bind
readinessProbe:
  tcpSocket:
    port: bind

nodeSelector: {}

tolerations: []

affinity: {}

extraObjects: []
