{{- if .Values.ingress.enabled -}}
{{- $fullName := include "frps.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $annotations := deepCopy (.Values.ingress.annotations | default dict) -}}
{{- if and .Values.ingress.className (not (hasKey $annotations "kubernetes.io/ingress.class")) -}}
{{- $_ := set $annotations "kubernetes.io/ingress.class" .Values.ingress.className -}}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "frps.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ $fullName }}
                port:
                  number: {{ $svcPort }}
          {{- end }}
    {{- end }}
{{- end }}
